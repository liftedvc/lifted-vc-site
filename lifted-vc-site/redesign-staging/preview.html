<style>
/* ==========================================================
   Lifted.vc — Simple, colorful editorial system
   ========================================================== */

:root {
  /* Default palette — warm cream base, colored section blocks */
  --bg: #fbf6ec;          /* warm off-white base */
  --ink: #1a1a1a;         /* near-black */
  --ink-soft: #4f4d49;    /* muted text */
  --ink-mute: #8a8680;    /* tertiary */
  --line: #e6dfd0;
  --line-soft: #efe9db;

  /* Color blocks (used as section backgrounds) */
  --butter: #f5d574;      /* sunny yellow */
  --butter-deep: #d9b449;
  --sage: #b6cdb4;        /* soft sage green */
  --sage-deep: #6f8e6e;
  --sky: #aac4dd;         /* dusty sky blue */
  --sky-deep: #5d7d9c;
  --blush: #efbfb1;       /* warm blush */
  --blush-deep: #c2806e;
  --deep: #1a2235;        /* deep navy ink */
  --cream: #fbf6ec;

  /* Accent for buttons/links */
  --accent: #c25a3c;      /* warm terracotta */
  --accent-deep: #8d3a24;

  --serif: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --sans: 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', monospace;
}

/* Alt palette: punchier */
[data-palette="bright"] {
  --butter: #ffd95a;
  --sage: #a8d8b0;
  --sky: #9cc1e5;
  --blush: #f5b8a5;
  --accent: #e85a3c;
}
/* Alt palette: muted */
[data-palette="muted"] {
  --butter: #ead7a0;
  --sage: #c2d2c0;
  --sky: #b8cad8;
  --blush: #e6c8be;
  --accent: #a85c44;
}
/* Alt palette: editorial mono */
[data-palette="mono"] {
  --butter: #ece5d3;
  --sage: #ddd9ce;
  --sky: #d4d2cb;
  --blush: #ebd9d2;
  --accent: #1a1a1a;
}

/* Type pairs */
[data-type="fraunces-inter"] {
  --serif: 'Fraunces', Georgia, serif;
  --sans: 'Inter Tight', 'Helvetica Neue', sans-serif;
}
[data-type="newsreader-geist"] {
  --serif: 'Newsreader', Georgia, serif;
  --sans: 'Geist', 'Helvetica Neue', sans-serif;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body {
  font-size: 18px;
  line-height: 1.55;
  letter-spacing: -0.005em;
}

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }

::selection { background: var(--accent); color: var(--cream); }

/* Layout */
.wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 56px;
}

section { padding: 200px 0; position: relative; }
section.tight { padding: 100px 0; }

/* Type */
.serif { font-family: var(--serif); font-weight: 400; letter-spacing: -0.02em; }

h1, h2, h3, h4 {
  font-family: var(--serif);
  font-weight: 400;
  letter-spacing: -0.025em;
  margin: 0;
}

.eyebrow {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--ink-soft);
  display: inline-flex; align-items: center; gap: 8px;
}
.eyebrow::before {
  content: '';
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  display: inline-block;
}

/* Buttons — pill, soft */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 16px 28px;
  border-radius: 999px;
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 500;
  border: 1.5px solid transparent;
  cursor: pointer;
  transition: transform .25s ease, background .25s ease, color .25s ease, border-color .25s ease;
  white-space: nowrap;
}
.btn-primary {
  background: var(--ink);
  color: var(--cream);
}
.btn-primary:hover {
  background: var(--accent);
  transform: translateY(-1px);
}
.btn-ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--ink);
}
.btn-ghost:hover {
  background: var(--ink);
  color: var(--cream);
}
.btn .arrow {
  transition: transform .25s ease;
}
.btn:hover .arrow { transform: translateX(3px); }

/* Reveal on scroll */
.reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity .8s cubic-bezier(.2,.8,.2,1), transform .8s cubic-bezier(.2,.8,.2,1);
}
.reveal.in {
  opacity: 1;
  transform: translateY(0);
}

/* Photo placeholder */
.photo {
  position: relative;
  background: var(--cream);
  overflow: hidden;
  border-radius: 8px;
}
.photo .stripes {
  position: absolute; inset: 0;
  background-image: repeating-linear-gradient(
    135deg,
    transparent 0 14px,
    rgba(0,0,0,0.04) 14px 15px
  );
}
.photo .label {
  position: absolute;
  left: 14px; bottom: 12px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-mute);
  background: var(--cream);
  padding: 5px 9px;
  border-radius: 3px;
}
.photo .caption {
  position: absolute;
  left: 14px; top: 14px;
  font-family: var(--sans);
  font-size: 12px;
  color: var(--ink-soft);
}
.photo img { width: 100%; height: 100%; object-fit: cover; }

/* Marquee */
@keyframes marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
.marquee {
  display: flex;
  gap: 64px;
  width: max-content;
  animation: marquee 50s linear infinite;
}

/* Underline link */
.ulink {
  border-bottom: 1px solid currentColor;
  padding-bottom: 1px;
  transition: color .25s, border-color .25s;
}
.ulink:hover { color: var(--accent); }

/* Scrollbar */
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-mute); }

/* Color blocks */
.bg-butter { background: var(--butter); }
.bg-sage { background: var(--sage); }
.bg-sky { background: var(--sky); }
.bg-blush { background: var(--blush); }
.bg-deep { background: var(--deep); color: var(--cream); }
.bg-cream { background: var(--cream); }

/* ====== Responsive ====== */

/* Tablet */
@media (max-width: 1024px) {
  .wrap { padding: 0 32px; }
  section { padding: 140px 0; }
  body { font-size: 17px; }
}

/* Mobile */
@media (max-width: 768px) {
  .wrap { padding: 0 20px; }
  section { padding: 80px 0 !important; }
  section.tight { padding: 60px 0 !important; }
  .cta-section { padding: 100px 0 !important; }
  body { font-size: 16px; }

  /* Stack any 2/3-column grids tagged with data-stack */
  [data-stack="true"] { grid-template-columns: 1fr !important; gap: 32px !important; }

  /* Hero — stack and tighten */
  .hero-grid { min-height: auto !important; padding-top: 40px !important; padding-bottom: 80px !important; }

  /* Stats stack with separators */
  .stats-grid { gap: 32px !important; padding-top: 40px !important; padding-bottom: 60px !important; }

  /* Footer stack tighter */
  .footer-grid { gap: 36px !important; }
  .footer-bottom { flex-direction: column; gap: 8px !important; }
  .footer-bottom > div { text-align: left !important; }

  /* Buttons */
  .btn { padding: 13px 22px; font-size: 15px; }

  /* Marquee items smaller */
  .marquee > div { font-size: 18px !important; }
  .marquee { gap: 36px !important; }

  /* Forms — full width */
  .field-input input, .field-input textarea { font-size: 16px !important; }

  /* Tweaks panel — fit screen */
  .tweaks-panel { width: calc(100vw - 24px) !important; right: 12px !important; left: 12px !important; max-width: none !important; }
}

/* Mobile nav — drawer */
.mobile-toggle { display: none; }
@media (max-width: 900px) {
  .desktop-nav { display: none !important; }
  .mobile-toggle { display: flex !important; }
  :root { --nav-h: 64px; }
  .wordmark-img { height: 28px !important; }
}
@media (min-width: 901px) {
  .mobile-drawer { display: none !important; }
}

:root { color-scheme: light; }
html, body { background: var(--bg); }

// Primitives — shared building blocks

function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('in');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

function Reveal({ children, delay = 0, as = 'div', className = '', ...rest }) {
  const ref = useReveal();
  const Comp = as;
  return (
    <Comp ref={ref} className={`reveal ${className}`} style={{ transitionDelay: `${delay}ms` }} {...rest}>
      {children}
    </Comp>
  );
}

// Photo placeholder — labeled, striped. Caption = where it sits, label = what photo to drop in.
function Photo({ label, caption, ratio = '4 / 5', src, alt, style = {}, className = '' }) {
  return (
    <div className={`photo ${className}`} style={{ aspectRatio: ratio, ...style }}>
      {src ? <img src={src} alt={alt || label} /> : <div className="stripes" />}
      {caption && <div className="caption">{caption}</div>}
      {label && !src && <div className="label">{label}</div>}
    </div>
  );
}

// Arrow glyph
function Arrow({ size = 14 }) {
  return (
    <svg className="arrow" width={size} height={size} viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M2 7H12M12 7L8 3M12 7L8 11" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

// Counting number (animated reveal)
function CountUp({ value, prefix = '', suffix = '', duration = 1400 }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(0);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const start = performance.now();
          const tick = (now) => {
            const t = Math.min(1, (now - start) / duration);
            const eased = 1 - Math.pow(1 - t, 3);
            setShown(Math.round(value * eased));
            if (t < 1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.3 });
    io.observe(el);
    return () => io.disconnect();
  }, [value, duration]);
  return <span ref={ref}>{prefix}{shown}{suffix}</span>;
}

// === Mini router so internal links switch pages in-place ===
function App() {
  const [page, setPage] = useState('home');

  useEffect(() => {
    const handler = (e) => {
      const a = e.target.closest('a');
      if (!a) return;
      const href = a.getAttribute('href');
      if (!href) return;
      if (href.startsWith('http') || href.startsWith('mailto:')) return;
      const map = {
        'index.html': 'home',
        'about.html': 'about',
        'founders.html': 'founders',
        'pricing.html': 'pricing',
        'contact.html': 'contact',
      };
      const cleanHref = href.split('#')[0];
      if (cleanHref in map) {
        e.preventDefault();
        setPage(map[cleanHref]);
        window.scrollTo({ top: 0, behavior: 'instant' });
      } else if (href.startsWith('#')) {
        // allow same-page anchor scrolling
      } else if (href === '') {
        e.preventDefault();
      }
    };
    document.addEventListener('click', handler);
    return () => document.removeEventListener('click', handler);
  }, []);

  let body;
  if (page === 'home') body = <><Hero /><Proof /><Process /><ServicesTeaser /><FeaturedQuote /><CTA /></>;
  else if (page === 'about') body = <><AboutPage /><CTA /></>;
  else if (page === 'founders') body = <><FoundersPage /><CTA /></>;
  else if (page === 'pricing') body = <><PricingPage /><CTA /></>;
  else if (page === 'contact') body = <ContactPage />;

  return (
    <>
      <Nav current={page === 'home' ? 'home' : page} />
      {body}
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
