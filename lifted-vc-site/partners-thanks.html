<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Note received · Lifted.vc</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=Familjen+Grotesk:ital,wght@0,400;0,500;0,600;1,400&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#f7f6f2; --ink:#191d35; --ink-soft:#4a4e66; --butter:#dfa032; --accent:#2a1b4e; --serif:'Besley',Georgia,serif; --sans:'Familjen Grotesk','Helvetica Neue',sans-serif; }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--sans);background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:32px;-webkit-font-smoothing:antialiased}
    .check{width:66px;height:66px;border-radius:50%;background:var(--butter);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 24px}
    h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,7vw,60px);letter-spacing:-.02em;line-height:1;margin-bottom:16px}
    h1 span{font-style:normal;color:inherit}
    p{font-size:18px;color:var(--ink-soft);line-height:1.55;margin-bottom:30px;max-width:460px}
    a.btn{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:15px 28px;border-radius:999px;font-size:15px;font-weight:500;text-decoration:none;transition:background .25s}
    a.btn:hover{background:var(--accent)}
  </style>
  <!-- Cloudflare Web Analytics -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "96587fd6e076409aa9c480adef2564b4"}'></script>
  <!-- End Cloudflare Web Analytics -->
</head>
<body>
  <div>
    <div class="check">&#10003;</div>
    <h1>Note <span>received.</span></h1>
    <p>Thanks for reaching out. I read every note personally and will be in touch soon to talk about your portfolio.</p>
    <a class="btn" href="/">Back to Lifted.vc &rarr;</a>
  </div>
</body>
</html>
