[build]
  publish = "."
  # Regenerate the client dashboard's playbook (fundraising-playbook-shared.html)
  # from the single source of truth (fundraising-playbook.html) on every deploy,
  # so the two never drift. The script is best-effort and never fails the build.
  command = "node scripts/build-shared-playbook.mjs"

# Framing is controlled via CSP frame-ancestors: the site may only be embedded
# by Lifted's own dashboard origins (clickjacking protection is preserved).
# This replaces X-Frame-Options: DENY so the fundraising playbook can be embedded
# inside the client dashboard.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://lifted.vc https://www.lifted.vc https://app.lifted.vc https://lifted-dashboard-staging.netlify.app"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "https://www.lifted.vc/*"
  to = "https://lifted.vc/:splat"
  status = 301
  force = true
